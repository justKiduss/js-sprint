<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<style>
    body{
        display:flex;
        justify-content: center;
        align-items: center;
    }
    .lists{
    padding:0; 
  }
    li{
        list-style-type: none;
        margin:5px 0;
    }
    li button{
        margin-left:10px;
    }
    
</style>
<body>
    <div>
        <h1>Todo App</h1>
        <input class="input" minlength="1" placeholder="add tasks"/>
        <button class="add">Add</button>
        <ul class="lists">
            
        </ul>
        <p class="error" style="color:red"></p>
    </div>
    <script>
        let textInput=document.querySelector(".input");
        let addBtn=document.querySelector(".add");
        let taskList=document.querySelector(".lists");

        let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

        function saveTasks(){
          localStorage.setItem("tasks",JSON.stringify(tasks));
        }
       
        function addTasks(){
        let text=textInput.value.trim();

        if(!text){
           document.querySelector(".error").textContent = "Task must be added!";
            return; 
        }
        setTimeout(()=>document.querySelector(".error").textContent = "",3000)
        tasks.push({text,done:false});
            textInput.value="";

        }
        function renderTasks(){
            taskList.innerHTML=""
            tasks.forEach((task,index)=>{
            let li=document.createElement("li");
            let span=document.createElement('span');
            let delbtn=document.createElement('button');
            let check=document.createElement("input");
            check.type="checkbox"
            check.checked=task.done;
if(task.done) span.style.textDecoration="line-through"
            check.onchange=()=>{
            tasks[index].done=check.checked;
            saveTasks();
            renderTasks();
            }

            delbtn.textContent="Delete";
            
            span.textContent=task.text;
            // delbtn.onclick=()=>{
            //     tasks.splice(index,1);
            //     saveTasks();
            //     renderTasks();
            // }
            li.appendChild(check)
            li.appendChild(span);
            li.appendChild(delbtn);
            taskList.appendChild(li);
            
            })
          taskList.addEventListener("click",(e)=>{
            if(e.target.tagName==="BUTTON");
            let index=[...taskList.children].indexOf(e.target.parentElement)
            tasks.splice(index,1);
            saveTasks();
            renderTasks();
          })
        }
          addBtn.onclick=()=>{
            addTasks();
            saveTasks();
            renderTasks();
        }
       renderTasks();
    </script>
</body>
</html>
