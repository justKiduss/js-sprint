<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<style>
    body{
        font-family: Arial, sans-serif;
        display:flex;
        align-items: center;
        justify-content: center;
        /* max-width: 100%; */
        width:90%;
        height:100vh;
        margin:0;
        background-color: whitesmoke;
        min-height: 100vh;
    }
    form{
        display:flex;
        gap:10px
    } 
    #error{
        color:red;
    }
    #weather{
        width:400px;
        /* min-height:400px; */
        background:white;
        color:black;
        text-align: center;
        padding:10px;
        border-radius: 5px;
    }
    #city{
        width:300px;
        height:30px; 
    }
    #container{
        width: 90%; 
        max-width: 500px; 
        text-align: center;
    }
</style>
<body>
    <div id="container">
       <form id="form">
        <input type="text" placeholder="Addis Ababa" id="city"/>
        <button type="submit" id="search">search</button>
       </form>
       <p id="error"></p>
       <div id="weather"></div>
    </div>
    <script>
    let API_KEY="b15dccb06f81acf3852c4e9c16d586e9";
    let form=document.getElementById("form");
    let city=document.getElementById("city");
    let error=document.getElementById("error");
    let weather=document.getElementById("weather");
    form.addEventListener("submit",(e)=>{
        e.preventDefault();
        if(city.value===""){
            error.textContent="Enter your City Name"
            setTimeout(()=>error.textContent="",3000);
            return;
        }
        let City=city.value.trim();
        WeatherInfo(City);
        city.value=""
    })
    async function WeatherInfo(City){
        try{
        const response=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${City}&appid=${API_KEY}&units=metric`,{
        method:"GET",
        
        })
        if(!response.ok){
            error.textContent="City not found";
            setTimeout(()=>error.textContent="",3000);
            return;
        }
        const data=await response.json();
        weather.innerHTML=`<h1>${data.name}</h1><p>weather condition</p><p>${data.weather[0].main}</p> <p>${data.weather[0].description}</p><p>${data.main.temp} c</p>  `;
        console.log(data);
        }catch(error){
        error.textContent="Network is not working";
        }
    }
  
    </script>
</body>
</html>
