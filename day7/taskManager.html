<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
</head>
<style>
    body{
    font-family: Arial, sans-serif;
    width:100%;
    height:100vh;
    display:flex;
    justify-content: center;
    align-items: center;
    margin:0;
    min-height: 100vh;

}
#error{
    color:red;
}
form{
    display:flex;
    gap:10px;
}
#taskInput{
    width:250px;
    height:30px;
}
#container{
    padding: 10px;
    /* width:90%; */
    /* min-width: 700px; */
}
</style>
<body>
    <div id="container">
        <form id="form">
        <input type="text" id="taskInput" placeholder="add task"/>
        <button id="addbtn">Add</button>
        </form>
          <ul id="ul">

          </ul>
        <p id="error"></p>
    </div>

    <script>
        let taskInput=document.getElementById("taskInput");
        let form=document.getElementById("form");
        let ul=document.getElementById("ul");
        let error=document.getElementById("error");
        let tasks=JSON.parse(localStorage.getItem("tasks"))||[];
        form.addEventListener("submit",(e)=>{
              e.preventDefault();
              if(taskInput.value===""){
               error.textContent="the field is empty";
               setTimeout(()=>error.textContent="",3000);
              }
               let task=taskInput.value.trim();
            try{
               if(task.length>=2){
               if(tasks.includes(task)){
                error.textContent=`${task} this task already added`;
                setTimeout(()=>error.textContent="",3000);
                return
                }
                tasks.push({text:task,done:false});
                saveToStorage();
                renderTasks();
                taskInput.value=""
                }else{
                   error.textContent=`${task} this task length is short`; 
                   setTimeout(()=>error.textContent="",3000);
                   return
                }

            }catch(error){
                console.erroe(error);
            } 
            })

        function renderTasks(){
            ul.innerHTML="";
            tasks.forEach((task)=>{
            let li=document.createElement("li");
            let delbtn=document.createElement("button");
            let check=document.createElement("input");
            check.type="checkbox";
            check.checked=task.done;
            delbtn.textContent='Delete';
              li.textContent=task.text;
              li.appendChild(delbtn);
              li.appendChild(check);
              ul.appendChild(li);
            })
            delbtnHandler();
            checkbtn();
        }
        function saveToStorage(){
            localStorage.setItem("tasks",JSON.stringify(tasks));
        }

        function delbtnHandler(){
           ul.addEventListener("click",(e)=>{
            if(e.target.tagName=="BUTTON"){
                let index=[...ul.children].indexOf(e.target.parentElement);
                tasks=tasks.filter((_,currentIndex)=>(
                    currentIndex!==index
                ))
                saveToStorage();
                renderTasks();
            }

           })
        }
        function checkbtn(){
            ul.addEventListener("click",(e)=>{
                if(e.target.tagName=="INPUT"){
                  let index=[...ul.children].indexOf(e.target.parentElement);
                  tasks[index].done=e.target.checked;
                  saveToStorage()
                }
            })
        }
        renderTasks();
    </script>
</body>
</html>
